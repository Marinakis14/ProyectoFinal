<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      .bg { fill: #f7f1e4; }
      .state { fill: #fbf7ed; stroke: #5b4632; stroke-width: 2; rx: 8; }
      .final { fill: #f7f1e4; stroke: #2b241d; stroke-width: 3; }
      .dot { fill: #2b241d; }
      .line { stroke: #4c3a2a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .text { font-family: Arial, sans-serif; fill: #251a12; font-size: 16px; text-anchor: middle; }
      .small { font-family: Arial, sans-serif; fill: #251a12; font-size: 13px; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; fill: #251a12; font-size: 12px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; fill: #251a12; font-size: 26px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#4c3a2a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="900"/>
  <text class="title" x="600" y="42">Valdris - Estados de la partida</text>

  <circle class="dot" cx="90" cy="105" r="14"/>
  <rect class="state" x="175" y="78" width="160" height="54"/><text class="text" x="255" y="111">Menú principal</text>
  <rect class="state" x="410" y="78" width="190" height="54"/><text class="text" x="505" y="102">Introducción</text><text class="small" x="505" y="121">narrativa</text>
  <rect class="state" x="675" y="78" width="190" height="54"/><text class="text" x="770" y="102">Selección de</text><text class="small" x="770" y="121">personaje</text>
  <rect class="state" x="940" y="78" width="170" height="54"/><text class="text" x="1025" y="111">Descenso inicial</text>

  <rect class="state" x="175" y="230" width="170" height="54"/><text class="text" x="260" y="262">Cargando partida</text>
  <rect class="state" x="500" y="230" width="160" height="54"/><text class="text" x="580" y="262">Exploración</text>
  <rect class="state" x="790" y="230" width="160" height="54"/><text class="text" x="870" y="262">Turno jugador</text>

  <rect class="state" x="790" y="385" width="160" height="54"/><text class="text" x="870" y="417">Cambio sala</text>
  <rect class="state" x="500" y="385" width="160" height="54"/><text class="text" x="580" y="417">Turno enemigos</text>
  <rect class="state" x="175" y="385" width="170" height="54"/><text class="text" x="260" y="417">Combate final</text>

  <rect class="state" x="260" y="585" width="150" height="54"/><text class="text" x="335" y="617">Victoria</text>
  <rect class="state" x="560" y="585" width="150" height="54"/><text class="text" x="635" y="617">Derrota</text>
  <rect class="state" x="830" y="585" width="170" height="54"/><text class="text" x="915" y="617">Resumen final</text>
  <rect class="state" x="830" y="735" width="170" height="54"/><text class="text" x="915" y="767">Resumen exportado</text>
  <circle class="final" cx="1090" cy="762" r="22"/><circle class="dot" cx="1090" cy="762" r="12"/>

  <line class="line" x1="104" y1="105" x2="175" y2="105"/>
  <line class="line" x1="335" y1="105" x2="410" y2="105"/><text class="label" x="372" y="94">nueva partida</text>
  <line class="line" x1="600" y1="105" x2="675" y2="105"/><text class="label" x="637" y="94">continuar</text>
  <line class="line" x1="865" y1="105" x2="940" y2="105"/><text class="label" x="902" y="94">elegido</text>
  <path class="line" d="M1025 132 V205 H660"/><text class="label" x="917" y="192">comenzar</text>
  <path class="line" d="M255 132 V230"/><text class="label" x="205" y="188">cargar</text>
  <line class="line" x1="345" y1="257" x2="500" y2="257"/><text class="label" x="422" y="246">carga correcta</text>
  <line class="line" x1="660" y1="257" x2="790" y2="257"/><text class="label" x="725" y="246">sala activa</text>

  <path class="line" d="M870 284 V385"/><text class="label" x="922" y="340">abre acceso</text>
  <path class="line" d="M790 412 H710 V285 H790"/><text class="label" x="718" y="350">reinicia fases</text>
  <line class="line" x1="790" y1="412" x2="660" y2="412"/><text class="label" x="725" y="401">fin acciones</text>
  <path class="line" d="M580 385 V315 H790"/><text class="label" x="640" y="333">enemigos terminan</text>
  <line class="line" x1="500" y1="412" x2="345" y2="412"/><text class="label" x="422" y="401">sala final</text>
  <path class="line" d="M260 385 V315 H790"/><text class="label" x="463" y="323">fase Parasito activa</text>

  <line class="line" x1="260" y1="439" x2="335" y2="585"/><text class="label" x="286" y="525">Parasito derrotado</text>
  <line class="line" x1="345" y1="439" x2="635" y2="585"/><text class="label" x="495" y="515">jugador muere</text>
  <path class="line" d="M870 284 C980 410 815 520 710 585"/><text class="label" x="940" y="463">muerte o turnos</text>
  <path class="line" d="M580 439 C600 495 620 540 635 585"/><text class="label" x="670" y="515">daño enemigo</text>

  <line class="line" x1="410" y1="612" x2="830" y2="612"/><text class="label" x="620" y="601">ver desenlace</text>
  <line class="line" x1="710" y1="612" x2="830" y2="612"/>
  <line class="line" x1="915" y1="639" x2="915" y2="735"/><text class="label" x="975" y="690">exportar</text>
  <path class="line" d="M830 762 H760 V640 H830"/><text class="label" x="760" y="706">continuar</text>
  <line class="line" x1="1000" y1="762" x2="1068" y2="762"/><text class="label" x="1034" y="748">salir</text>
</svg>
