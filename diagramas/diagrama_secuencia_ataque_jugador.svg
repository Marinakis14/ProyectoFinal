<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820">
  <defs>
    <style>
      .bg { fill: #f7f1e4; }
      .box { fill: #fbf7ed; stroke: #5b4632; stroke-width: 2; rx: 7; }
      .alt { fill: #efe2c7; stroke: #806649; stroke-width: 1.5; rx: 6; }
      .life { stroke: #7d664d; stroke-width: 2; stroke-dasharray: 8 6; }
      .arrow { stroke: #4c3a2a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #4c3a2a; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .text { font-family: Arial, sans-serif; fill: #251a12; font-size: 15px; text-anchor: middle; }
      .small { font-family: Arial, sans-serif; fill: #251a12; font-size: 13px; text-anchor: middle; }
      .left { font-family: Arial, sans-serif; fill: #251a12; font-size: 13px; text-anchor: start; }
      .title { font-family: Arial, sans-serif; fill: #251a12; font-size: 26px; font-weight: 700; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; fill: #251a12; font-size: 14px; font-weight: 700; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#4c3a2a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1320" height="820"/>
  <text class="title" x="660" y="42">Valdris - Secuencia: ataque del jugador</text>

  <g id="participants">
    <rect class="box" x="30" y="80" width="120" height="42"/><text class="text" x="90" y="106">Jugador</text>
    <rect class="box" x="185" y="80" width="130" height="42"/><text class="text" x="250" y="106">GameView</text>
    <rect class="box" x="350" y="80" width="150" height="42"/><text class="text" x="425" y="106">GameController</text>
    <rect class="box" x="535" y="80" width="130" height="42"/><text class="text" x="600" y="106">GameModel</text>
    <rect class="box" x="700" y="80" width="140" height="42"/><text class="text" x="770" y="106">TurnManager</text>
    <rect class="box" x="875" y="80" width="150" height="42"/><text class="text" x="950" y="106">CombatManager</text>
    <rect class="box" x="1060" y="80" width="110" height="42"/><text class="text" x="1115" y="106">Enemy</text>
    <rect class="box" x="1200" y="80" width="110" height="42"/><text class="text" x="1255" y="106">Log</text>

    <line class="life" x1="90" y1="122" x2="90" y2="780"/>
    <line class="life" x1="250" y1="122" x2="250" y2="780"/>
    <line class="life" x1="425" y1="122" x2="425" y2="780"/>
    <line class="life" x1="600" y1="122" x2="600" y2="780"/>
    <line class="life" x1="770" y1="122" x2="770" y2="780"/>
    <line class="life" x1="950" y1="122" x2="950" y2="780"/>
    <line class="life" x1="1115" y1="122" x2="1115" y2="780"/>
    <line class="life" x1="1255" y1="122" x2="1255" y2="780"/>
  </g>

  <line class="arrow" x1="90" y1="160" x2="250" y2="160"/><text class="small" x="170" y="150">selecciona enemigo y pulsa atacar</text>
  <line class="arrow" x1="250" y1="205" x2="425" y2="205"/><text class="small" x="337" y="195">onBotonAtacar(enemy)</text>
  <line class="arrow" x1="425" y1="250" x2="600" y2="250"/><text class="small" x="512" y="240">atacar(enemy)</text>
  <line class="arrow" x1="600" y1="295" x2="770" y2="295"/><text class="small" x="685" y="285">atacar(enemy)</text>

  <path class="arrow" d="M770 335 C835 335 835 365 770 365"/><text class="small" x="836" y="352">validar fase</text>
  <line class="arrow" x1="770" y1="405" x2="950" y2="405"/><text class="small" x="860" y="395">puedeAtacar(player, enemy)</text>

  <rect class="alt" x="55" y="435" width="1210" height="260"/>
  <text class="label" x="75" y="460">alt objetivo válido</text>

  <line class="return" x1="950" y1="485" x2="770" y2="485"/><text class="small" x="860" y="475">true</text>
  <line class="arrow" x1="770" y1="525" x2="950" y2="525"/><text class="small" x="860" y="515">atacar(player, enemy)</text>
  <line class="arrow" x1="950" y1="565" x2="1115" y2="565"/><text class="small" x="1032" y="555">aplicarDanio(danio)</text>
  <line class="return" x1="1115" y1="605" x2="950" y2="605"/><text class="small" x="1032" y="595">estado actualizado</text>
  <line class="return" x1="950" y1="645" x2="770" y2="645"/><text class="small" x="860" y="635">CombatResult</text>
  <path class="arrow" d="M770 675 C835 675 835 700 770 700"/><text class="small" x="852" y="692">consumir fase y registrar log</text>

  <line class="return" x1="770" y1="725" x2="600" y2="725"/><text class="small" x="685" y="715">resultado</text>
  <line class="return" x1="600" y1="750" x2="425" y2="750"/><text class="small" x="512" y="740">mensaje y estado</text>
  <line class="arrow" x1="425" y1="775" x2="250" y2="775"/><text class="small" x="337" y="765">refrescar()</text>
  <line class="arrow" x1="250" y1="735" x2="1255" y2="735"/><text class="small" x="755" y="725">mostrarMensajes(log)</text>

  <line class="alt" x1="55" y1="705" x2="1265" y2="705"/>
  <text class="label" x="75" y="720">else objetivo inválido: TurnManager devuelve error, la vista muestra aviso y el log añade el mensaje</text>
</svg>
