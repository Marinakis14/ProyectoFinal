<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1520" viewBox="0 0 980 1520">
  <defs>
    <style>
      .bg { fill: #f7f1e4; }
      .action { fill: #fffdf7; stroke: #5b4632; stroke-width: 2; rx: 8; }
      .decision { fill: #ead9b8; stroke: #5b4632; stroke-width: 2; }
      .start { fill: #2b241d; stroke: #2b241d; }
      .end { fill: #f7f1e4; stroke: #2b241d; stroke-width: 3; }
      .end-dot { fill: #2b241d; }
      .line { stroke: #4c3a2a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .text { font-family: Arial, sans-serif; fill: #251a12; font-size: 16px; text-anchor: middle; }
      .small { font-family: Arial, sans-serif; fill: #251a12; font-size: 13px; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; fill: #251a12; font-size: 13px; text-anchor: middle; }
      .title { font-family: Arial, sans-serif; fill: #251a12; font-size: 26px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#4c3a2a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="1520"/>
  <text class="title" x="490" y="42">Valdris - Actividad del turno del jugador</text>

  <circle class="start" cx="490" cy="82" r="14"/>
  <line class="line" x1="490" y1="96" x2="490" y2="120"/>

  <rect class="action" x="340" y="120" width="300" height="54"/>
  <text class="text" x="490" y="153">Comenzar turno del jugador</text>
  <line class="line" x1="490" y1="174" x2="490" y2="205"/>

  <rect class="action" x="325" y="205" width="330" height="58"/>
  <text class="text" x="490" y="229">Procesar efectos de</text>
  <text class="small" x="490" y="248">inicio de turno</text>
  <line class="line" x1="490" y1="263" x2="490" y2="298"/>

  <polygon class="decision" points="490,298 630,348 490,398 350,348"/>
  <text class="text" x="490" y="344">¿Jugador</text>
  <text class="small" x="490" y="362">derrotado?</text>
  <path class="line" d="M630 348 H790 V430"/>
  <text class="label" x="720" y="338">sí</text>
  <rect class="action" x="680" y="430" width="220" height="54"/>
  <text class="text" x="790" y="463">Registrar derrota</text>
  <line class="line" x1="790" y1="484" x2="790" y2="535"/>
  <circle class="end" cx="790" cy="560" r="21"/>
  <circle class="end-dot" cx="790" cy="560" r="12"/>
  <line class="line" x1="490" y1="398" x2="490" y2="430"/>
  <text class="label" x="518" y="416">no</text>

  <rect class="action" x="325" y="430" width="330" height="54"/>
  <text class="text" x="490" y="463">Mostrar celdas alcanzables</text>
  <line class="line" x1="490" y1="484" x2="490" y2="515"/>

  <polygon class="decision" points="490,515 630,565 490,615 350,565"/>
  <text class="text" x="490" y="561">¿Quiere</text>
  <text class="small" x="490" y="579">moverse?</text>
  <line class="line" x1="490" y1="615" x2="490" y2="645"/>
  <text class="label" x="518" y="633">sí</text>

  <rect class="action" x="335" y="645" width="310" height="54"/>
  <text class="text" x="490" y="678">Seleccionar destino</text>
  <line class="line" x1="490" y1="699" x2="490" y2="728"/>

  <polygon class="decision" points="490,728 630,778 490,828 350,778"/>
  <text class="text" x="490" y="774">¿Destino</text>
  <text class="small" x="490" y="792">válido?</text>
  <line class="line" x1="490" y1="828" x2="490" y2="858"/>
  <text class="label" x="518" y="846">sí</text>

  <rect class="action" x="335" y="858" width="310" height="62"/>
  <text class="text" x="490" y="884">Mover jugador y consumir</text>
  <text class="small" x="490" y="903">fase de movimiento</text>

  <path class="line" d="M630 778 H820 V890 H645"/>
  <text class="label" x="716" y="768">no</text>
  <rect class="action" x="690" y="805" width="260" height="54"/>
  <text class="text" x="820" y="838">Mostrar movimiento inválido</text>

  <path class="line" d="M350 565 H220 V950 H490"/>
  <text class="label" x="292" y="555">no</text>
  <line class="line" x1="490" y1="920" x2="490" y2="950"/>

  <polygon class="decision" points="490,950 640,1005 490,1060 340,1005"/>
  <text class="text" x="490" y="1001">¿Ha cambiado</text>
  <text class="small" x="490" y="1019">de sala?</text>
  <path class="line" d="M640 1005 H790 V1080"/>
  <text class="label" x="715" y="995">sí</text>
  <rect class="action" x="675" y="1080" width="230" height="68"/>
  <text class="text" x="790" y="1106">Entrar en nueva sala</text>
  <text class="small" x="790" y="1128">y reiniciar fases</text>
  <line class="line" x1="790" y1="1148" x2="790" y2="1198"/>
  <circle class="end" cx="790" cy="1223" r="21"/>
  <circle class="end-dot" cx="790" cy="1223" r="12"/>
  <line class="line" x1="490" y1="1060" x2="490" y2="1090"/>
  <text class="label" x="518" y="1078">no</text>

  <polygon class="decision" points="490,1090 650,1145 490,1200 330,1145"/>
  <text class="text" x="490" y="1141">¿Interactuar</text>
  <text class="small" x="490" y="1159">o recoger?</text>
  <line class="line" x1="490" y1="1200" x2="490" y2="1230"/>
  <text class="label" x="518" y="1218">sí</text>

  <rect class="action" x="310" y="1230" width="360" height="62"/>
  <text class="text" x="490" y="1256">Resolver interacción</text>
  <text class="small" x="490" y="1275">y actualizar inventario o sala</text>
  <line class="line" x1="490" y1="1292" x2="490" y2="1320"/>

  <polygon class="decision" points="490,1320 650,1375 490,1430 330,1375"/>
  <text class="text" x="490" y="1371">¿Usar objeto</text>
  <text class="small" x="490" y="1389">o atacar?</text>
  <line class="line" x1="490" y1="1430" x2="490" y2="1460"/>
  <text class="label" x="518" y="1448">sí/no</text>

  <rect class="action" x="315" y="1460" width="350" height="44"/>
  <text class="text" x="490" y="1488">Resolver acción final disponible</text>

  <path class="line" d="M330 1145 H205 V1460 H315"/>
  <text class="label" x="262" y="1135">no</text>
  <path class="line" d="M665 1482 H760 V1320"/>
  <rect class="action" x="690" y="1250" width="220" height="62"/>
  <text class="text" x="800" y="1276">Comprobar victoria</text>
  <text class="small" x="800" y="1295">o derrota</text>
  <line class="line" x1="760" y1="1320" x2="490" y2="1320"/>

  <path class="line" d="M490 1504 V1510"/>
  <circle class="end" cx="490" cy="1498" r="18"/>
  <circle class="end-dot" cx="490" cy="1498" r="10"/>

  <text class="small" x="232" y="1495">Si la partida continúa, se resuelve el turno enemigo</text>
  <text class="small" x="232" y="1512">y después comienza el siguiente turno.</text>
</svg>
